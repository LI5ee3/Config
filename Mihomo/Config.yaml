# ===== 基础设置 =====
mixed-port: 7890
allow-lan: false
bind-address: "*"
mode: rule
log-level: info
ipv6: false
find-process-mode: strict
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome

external-controller: 127.0.0.1:9090
secret: ""

# 如需面板，可取消下面三行注释。
# external-ui: ui
# external-ui-name: metacubexd
# external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"

profile:
  store-selected: true
  store-fake-ip: true

geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
geox-url:
  mmdb: "https://github.com/Hackl0us/GeoIP2-CN/raw/release/Country.mmdb"

# ===== TUN 模式 =====
tun:
  enable: false
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: false
  dns-hijack:
    - any:53

# ===== 域名嗅探 =====
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - "+.lan"
    - "+.local"
    - "localhost.ptlogin2.qq.com"

# ===== DNS =====
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  use-hosts: true
  use-system-hosts: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*.lan"
    - "*.local"
    - "localhost"
    - "*.srv.nintendo.net"
    - "*.stun.playstation.net"
    - "xbox.*.microsoft.com"
    - "*.xboxlive.com"
    - "*.battlenet.com.cn"
    - "*.battlenet.com"
    - "*.blzstatic.cn"
    - "*.battle.net"
    - "stun.ugreengroup.com"
    - "*.pub.3gppnetwork.org"
    - "*.t-mobile.com"
    - "*.apple.com"
    - "*.msftconnecttest.com"
    - "*.msftncsi.com"
    - "+.pool.ntp.org"
    - "time.*.com"
    - "time.*.gov"
    - "time.*.edu.cn"
    - "ntp.*.com"
    - "ntp.*.com.cn"
    - "*.ntp.org.cn"
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 1.1.1.1
  nameserver-policy:
    "+.pub.3gppnetwork.org": "https://8.8.8.8/dns-query"
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  fallback:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw

# ===== 节点订阅 =====
proxy-providers:
  airport_1:
    type: http
    url: "__PROXY_PROVIDER_URL_1__"
    path: ./proxy_providers/airport_1.yaml
    interval: 86400
    health-check:
      enable: true
      url: http://connectivitycheck.gstatic.com/generate_204
      interval: 600
      timeout: 2000
      expected-status: 204

  airport_2:
    type: http
    url: "__PROXY_PROVIDER_URL_2__"
    path: ./proxy_providers/airport_2.yaml
    interval: 86400
    health-check:
      enable: true
      url: http://connectivitycheck.gstatic.com/generate_204
      interval: 600
      timeout: 2000
      expected-status: 204

# 手动节点留空；如需手写节点，把 [] 改为列表。
# proxies: []

# ===== 策略组 =====
proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "🇭🇰 香港节点"
      - "🇺🇲 美国节点"
      - "🇯🇵 日本节点"
      - "🇹🇼 台湾节点"
      - "🇸🇬 新加坡节点"
      - "✈️ 我的节点"
      - "🀄️ 大陆直连"

  - name: "🍎 苹果服务"
    type: select
    proxies:
      - "🇭🇰 香港节点"
      - "🇺🇲 美国节点"
      - "🀄️ 大陆直连"

  - name: "☁️ OneDrive"
    type: select
    proxies:
      - "🇭🇰 香港节点"
      - "🀄️ 大陆直连"

  - name: "💵 Paypal"
    type: select
    proxies:
      - "🇭🇰 香港节点"
      - "🇺🇲 美国节点"
      - "🀄️ 大陆直连"

  - name: "🎲 Steam"
    type: select
    proxies:
      - "🇭🇰 香港节点"
      - "🀄️ 大陆直连"

  - name: "🎮 游戏平台"
    type: select
    proxies:
      - "🇭🇰 香港节点"
      - "🀄️ 大陆直连"

  - name: "🛍️ 电商平台"
    type: select
    proxies:
      - "🇭🇰 香港节点"
      - "🀄️ 大陆直连"

  - name: "🇭🇰 香港节点"
    type: url-test
    use:
      - airport_1
    filter: "(?i)香港|港|HK|Hong Kong|HongKong"
    url: http://connectivitycheck.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 2000
    lazy: true
    hidden: true

  - name: "🇺🇲 美国节点"
    type: url-test
    use:
      - airport_1
    filter: "(?i)美国|美國|US|USA|United States|America"
    url: http://connectivitycheck.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 2000
    lazy: true
    hidden: true

  - name: "🇯🇵 日本节点"
    type: url-test
    use:
      - airport_1
    filter: "(?i)日本|JP|Japan"
    url: http://connectivitycheck.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 2000
    lazy: true
    hidden: true

  - name: "🇹🇼 台湾节点"
    type: url-test
    use:
      - airport_1
    filter: "(?i)台湾|台灣|TW|Taiwan"
    url: http://connectivitycheck.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 2000
    lazy: true
    hidden: true

  - name: "🇸🇬 新加坡节点"
    type: url-test
    use:
      - airport_1
    filter: "(?i)新加坡|狮城|獅城|SG|Singapore"
    url: http://connectivitycheck.gstatic.com/generate_204
    interval: 600
    tolerance: 50
    timeout: 2000
    lazy: true
    hidden: true

  - name: "🀄️ 大陆直连"
    type: select
    proxies:
      - DIRECT

  - name: "♻️ 网络净化"
    type: select
    proxies:
      - REJECT

  - name: "✈️ 我的节点"
    type: select
    use:
      - airport_1
      
  - name: "🎬 流媒体"
    type: select
    use:
      - airport_2
      
  - name: GLOBAL
    type: select
    proxies:
      - "🚀 节点选择"
      - "🇭🇰 香港节点"
      - "🇺🇲 美国节点"
      - "🇯🇵 日本节点"
      - "🇹🇼 台湾节点"
      - "🇸🇬 新加坡节点"
      - "🀄️ 大陆直连"

