# ==========================================
# 基于 Surge Config.conf 转换的 Clash Party 配置
# 内核要求: Mihomo (Clash.Meta)
# ==========================================

# ----------------- 基础设置 -----------------
mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

# ----------------- TUN 模式设置 -----------------
tun:
  enable: true
  stack: system
  auto-route: true
  auto-detect-interface: true
  # Surge 中的 skip-proxy IP 段可通过规则或 TUN 的排除路由实现，这里默认由规则接管本地流量

# ----------------- DNS 设置 -----------------
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.srv.nintendo.net'
    - '*.stun.playstation.net'
    - 'xbox.*.microsoft.com'
    - '*.xboxlive.com'
    - '*.battlenet.com.cn'
    - '*.battlenet.com'
    - '*.blzstatic.cn'
    - '*.battle.net'
    - 'stun.ugreengroup.com'
    - '*.pub.3gppnetwork.org'
    - '*.t-mobile.com'
    - '*.apple.com'
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver-policy:
    # 对应 Surge [Host] 段的特定域名 DNS 解析
    '*.pub.3gppnetwork.org': 'https://8.8.8.8/dns-query'

# ----------------- 节点订阅 (Proxy Providers) -----------------
proxy-providers:
  "✈️ 我的节点":
    type: http
    url: "https://???????" # 请替换为你的实际节点订阅链接
    interval: 86400
    path: ./providers/my_nodes.yaml
    health-check:
      enable: true
      interval: 300
      url: http://connectivitycheck.gstatic.com/generate_204

# ----------------- 独立代理节点 (Proxies) -----------------
proxies:
  - name: "🇭🇰 香港落地"
    type: ss
    server: 0.0.0.0
    port: 77777
    cipher: 2022-blake3-aes-128-gcm
    password: "77777"
    udp: true
    # 对应 Surge 的 underlying-proxy 代理链功能
    dialer-proxy: "🇭🇰 香港节点"

  - name: "🇺🇸 美国落地"
    type: ss
    server: 0.0.0.0
    port: 77777
    cipher: 2022-blake3-aes-128-gcm
    password: "77777"
    udp: true
    dialer-proxy: "🇺🇲 美国节点"

# ----------------- 策略组 (Proxy Groups) -----------------
proxy-groups:
  # 1. 手动选择组
  - name: "🚀 节点选择"
    type: select
    proxies:
      - "🇭🇰 香港节点"
      - "🇺🇲 美国节点"
      - "🇯🇵 日本节点"
      - "🇨🇳 台湾节点"
      - "🇸🇬 新加坡节点"
      - "🀄️ 大陆直连"

  - name: "🍎 苹果服务"
    type: select
    proxies: ["🇭🇰 香港节点", "🇺🇲 美国节点", "🀄️ 大陆直连"]

  - name: "☁️ OneDrive"
    type: select
    proxies: ["🇭🇰 香港节点", "🀄️ 大陆直连"]

  - name: "💵 Paypal"
    type: select
    proxies: ["🇭🇰 香港节点", "🇺🇲 美国节点", "🀄️ 大陆直连"]

  - name: "🎮 游戏平台"
    type: select
    proxies: ["🇭🇰 香港节点", "🀄️ 大陆直连"]

  - name: "🛍️ 电商平台"
    type: select
    proxies: ["🇭🇰 香港节点", "🀄️ 大陆直连"]

  - name: "🀄️ 大陆直连"
    type: select
    proxies: [DIRECT]

  - name: "♻️ 网络净化"
    type: select
    proxies: [REJECT]

  # 2. 自动筛选与测速组 (对应 Surge 的 Smart 分组)
  - name: "🇭🇰 香港节点"
    type: url-test
    use: ["✈️ 我的节点"]
    filter: "香港"
    url: http://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇺🇲 美国节点"
    type: url-test
    use: ["✈️ 我的节点"]
    filter: "美国"
    url: http://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇯🇵 日本节点"
    type: url-test
    use: ["✈️ 我的节点"]
    filter: "日本"
    url: http://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇨🇳 台湾节点"
    type: url-test
    use: ["✈️ 我的节点"]
    filter: "台湾"
    url: http://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 50

  - name: "🇸🇬 新加坡节点"
    type: url-test
    use: ["✈️ 我的节点"]
    filter: "新加坡"
    url: http://connectivitycheck.gstatic.com/generate_204
    interval: 300
    tolerance: 50

