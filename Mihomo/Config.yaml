# ===== 分流规则 =====
rules:
  # 局域网地址
  - RULE-SET,lan,🀄️ 大陆直连

  # Adobe
  - RULE-SET,adobe,♻️ 网络净化

  # 个人规则集
  - RULE-SET,li5_direct,🀄️ 大陆直连
  - RULE-SET,li5_us,🇺🇲 美国节点
  - RULE-SET,li5_hk,🇭🇰 香港节点

  # T-Mobile WiFi Calling
  - RULE-SET,t_mobile,🇺🇲 美国节点

  # 苹果服务
  - RULE-SET,apple_intelligence,🇺🇲 美国节点
  - RULE-SET,apple,🍎 苹果服务

  # 游戏下载 & PT
  - RULE-SET,xbox_download,🀄️ 大陆直连
  - RULE-SET,game_download_cn,🀄️ 大陆直连
  - RULE-SET,steam_cn,🀄️ 大陆直连
  - RULE-SET,private_tracker,🀄️ 大陆直连
  - RULE-SET,download,🀄️ 大陆直连

  # AI
  - RULE-SET,gemini,🇺🇲 美国节点
  - RULE-SET,openai,🇺🇲 美国节点
  - RULE-SET,copilot,🇭🇰 香港节点

  # Google
  - RULE-SET,google,🇺🇲 美国节点

  # 流媒体
  - RULE-SET,youtube,🎬 流媒体
  - RULE-SET,netflix,🎬 流媒体
  - RULE-SET,disney,🎬 流媒体
  - RULE-SET,global_media,🇭🇰 香港节点

  # 电商平台
  - RULE-SET,e_commerce,🛍️ 电商平台

  # Paypal
  - RULE-SET,paypal,💵 Paypal

  # 微软 & Xbox
  - RULE-SET,onedrive,☁️ OneDrive
  - RULE-SET,xbox,🇭🇰 香港节点
  - RULE-SET,microsoft,🇭🇰 香港节点

  # 社交平台
  - RULE-SET,telegram,🇸🇬 新加坡节点
  - RULE-SET,whatsapp,🇭🇰 香港节点

  # 游戏平台
  - RULE-SET,steam,🎲 Steam
  - RULE-SET,epic,🎮 游戏平台
  - RULE-SET,origin,🎮 游戏平台
  - RULE-SET,ubisoft,🎮 游戏平台
  - RULE-SET,rockstar,🎮 游戏平台

  # Proxy
  - RULE-SET,proxy,🚀 节点选择

  # 中国大陆
  - RULE-SET,china_max,🀄️ 大陆直连
